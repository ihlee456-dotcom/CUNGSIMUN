<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<title>인터넷 연결 없음 | 컨택싱어</title>
<style>
:root{--bg:#fff;--fg:#141414;--muted:#6b6b6b;--accent:#D2451E}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--fg:#f2f2f2;--muted:#a3a3a3}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px;text-align:center}
.box{max-width:320px;display:flex;flex-direction:column;align-items:center;gap:14px}
.mark{width:64px;height:64px;border-radius:16px;background:var(--accent);display:flex;align-items:center;justify-content:center}
h1{font-size:20px;margin:6px 0 0}p{margin:0;color:var(--muted);font-size:15px;line-height:1.6}
button{margin-top:8px;min-height:48px;padding:0 28px;border:0;border-radius:12px;background:var(--fg);color:var(--bg);font:inherit;font-size:16px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<main class="box">
  <span class="mark" aria-hidden="true"><svg width="36" height="26" viewBox="0 0 28 20"><circle cx="10" cy="10" r="7.6" fill="none" stroke="#fff" stroke-width="2.6"/><circle cx="18" cy="10" r="7.6" fill="none" stroke="#fff" stroke-width="2.6"/><path d="M14 3.7A7.6 7.6 0 0 1 14 16.3A7.6 7.6 0 0 1 14 3.7Z" fill="#fff"/></svg></span>
  <h1>인터넷에 연결되어 있지 않아요</h1>
  <p>와이파이나 모바일 데이터를 켠 뒤 다시 시도해 주세요.</p>
  <button type="button" onclick="location.reload()">다시 시도</button>
</main>
</body>
</html>
